<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeatLoop LAB — test obrysów L</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:16px;background:#101b29;color:#e9f2ff}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #496079;padding:10px;text-align:left}svg{background:#fff;width:100%;max-width:540px}small{color:#aac1d9}</style><h1>HeatLoop LAB — test Spiral Inset dla L</h1><p>Test obliczeniowy obrysów, inspirowany OrcaSlicer Spiral Inset. Nie jest to import silnika C++ ani gotowy projekt rur.</p><svg id="drawing" viewBox="250 125 410 410"></svg><table><thead><tr><th>Rozstaw</th><th>Poprawne obrysy</th><th>Ostatni obrys</th><th>Wynik</th></tr></thead><tbody id="results"></tbody></table><p id="summary"></p><small>Pokrycie powierzchni i ciągłość dwuramiennego ślimaka wymagają osobnego testu.</small><script>
const P=[[300,175],[600,175],[600,325],[450,325],[450,475],[300,475]];
const signedArea=p=>p.reduce((a,v,i)=>a+v[0]*p[(i+1)%p.length][1]-p[(i+1)%p.length][0]*v[1],0)/2;
function offsetPolygon(p,d){const ccw=signedArea(p)>0,lines=[];for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<1)return null;let nx=(ccw?-dy:dy)/len,ny=(ccw?dx:-dx)/len;lines.push({a:[a[0]+nx*d,a[1]+ny*d],v:[dx,dy]})}let out=[];for(let i=0;i<p.length;i++){let u=lines[(i+p.length-1)%p.length],v=lines[i],cross=u.v[0]*v.v[1]-u.v[1]*v.v[0];if(Math.abs(cross)<1e-8)return null;let w=[v.a[0]-u.a[0],v.a[1]-u.a[1]],t=(w[0]*v.v[1]-w[1]*v.v[0])/cross;out.push([u.a[0]+u.v[0]*t,u.a[1]+u.v[1]*t])}return out}
function pointInside(q){let inside=false;for(let i=0,j=P.length-1;i<P.length;j=i++){let a=P[i],b=P[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])inside=!inside}return inside}
function dist(p,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function valid(r,d){if(!r||Math.abs(signedArea(r))<100)return false;for(let i=0;i<r.length;i++){let a=r[i],b=r[(i+1)%r.length];for(let k=0;k<=20;k++){let p=[a[0]+(b[0]-a[0])*k/20,a[1]+(b[1]-a[1])*k/20];if(!pointInside(p)||Math.min(...P.map((v,j)=>dist(p,v,P[(j+1)%P.length])))<d-2)return false}}return true}
const svg=document.getElementById('drawing'),ns='http://www.w3.org/2000/svg';
function draw(p,color,width=2){let e=document.createElementNS(ns,'polyline');e.setAttribute('points',p.concat([p[0]]).map(v=>v.join(',')).join(' '));e.setAttribute('fill','none');e.setAttribute('stroke',color);e.setAttribute('stroke-width',width);svg.appendChild(e)}
draw(P,'#222',4);let ok=0;
for(let spacing of [10,12,15,20]){let rings=[],d0=15.8;for(let k=0;k<20;k++){let d=d0+k*spacing,r=offsetPolygon(P,d);if(!valid(r,d))break;rings.push(r)}let status=rings.length>=2?'PASS: obrysy':'FAIL: za mało obrysów';if(rings.length>=2)ok++;document.getElementById('results').insertAdjacentHTML('beforeend','<tr><td>'+spacing+' cm</td><td>'+rings.length+'</td><td>'+(rings.length?(d0+(rings.length-1)*spacing).toFixed(1)+' cm':'—')+'</td><td>'+status+'</td></tr>');if(spacing===12)rings.forEach((r,i)=>draw(r,['#007bff','#e85d04','#16a34a','#9333ea','#c026d3'][i%5],2))}
document.getElementById('summary').textContent='Wynik: '+ok+'/4 przypadki z co najmniej dwoma poprawnymi obrysami. To NIE jest test kompletnego ślimaka.';</script></html>
