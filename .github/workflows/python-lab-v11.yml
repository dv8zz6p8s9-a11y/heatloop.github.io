name: HeatLoop Python LAB v1.1 checks
on:
  push:
    paths:
      - 'heatloop-test/python-lab-v11/**'
      - '.github/workflows/python-lab-v11.yml'
  pull_request:
    paths:
      - 'heatloop-test/python-lab-v11/**'
      - '.github/workflows/python-lab-v11.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1.1 JavaScript modules
        run: |
          for f in heatloop-test/python-lab-v11/*.mjs heatloop-test/python-lab-v11/rysunek-worker.js; do node --check "$f"; done
      - name: Test scale bar, UI, manifold rotation and routes
        run: node --test heatloop-test/python-lab-v11/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Shapely
        run: python -m pip install "shapely>=2.1,<3"
      - name: Verify Python engine syntax
        run: python -m py_compile heatloop-test/python-lab-v11/drawing_engine.py
      - name: Test 100 m spiral calculations and geometry
        run: python -m unittest discover -s heatloop-test/python-lab-v11/tests -p 'test_*.py' -v
