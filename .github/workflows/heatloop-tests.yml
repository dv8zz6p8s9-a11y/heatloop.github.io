name: HeatLoop BETA checks
on:
  push:
    paths:
      - 'heatloop-b/**'
      - 'help/**'
      - 'wdrozenie/**'
      - 'materialy/**'
      - 'pomoc.html'
      - 'instrukcja.html'
      - '.github/workflows/heatloop-tests.yml'
  pull_request:
    paths:
      - 'heatloop-b/**'
      - 'help/**'
      - 'wdrozenie/**'
      - 'materialy/**'
      - 'pomoc.html'
      - 'instrukcja.html'
      - '.github/workflows/heatloop-tests.yml'
  workflow_dispatch:
jobs:
  beta-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: heatloop-b/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix heatloop-b
      - name: Check JavaScript syntax
        run: |
          node --check heatloop-b/app.js
          for file in heatloop-b/*.mjs; do node --check "$file"; done
      - name: Check help knowledge, scope and server fallback
        run: node --test help/tests/*.test.mjs wdrozenie/tests/*.test.mjs
      - name: Run calculation and integration tests
        run: npm test --prefix heatloop-b
