name: HeatLoop Python LAB drawing geometry checks
on:
  push:
    paths:
      - 'heatloop-test/python-lab/**'
      - '.github/workflows/python-lab-calibration.yml'
  pull_request:
    paths:
      - 'heatloop-test/python-lab/**'
      - '.github/workflows/python-lab-calibration.yml'
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser scripts syntax
        run: |
          node --check heatloop-test/python-lab/calibration-utils.mjs
          node --check heatloop-test/python-lab/room-editor.mjs
          node --check heatloop-test/python-lab/manifold-utils.mjs
          node --check heatloop-test/python-lab/approach-routing.mjs
          node --check heatloop-test/python-lab/technical-drawing.mjs
          node --check heatloop-test/python-lab/rysunek-worker.js
      - name: Test dimensional calibration
        run: node --test heatloop-test/python-lab/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometric dependencies
        run: python -m pip install "shapely>=2.1,<3"
      - name: Test heating-area geometry in Python
        run: python -m unittest discover -s heatloop-test/python-lab/tests -p 'test_*.py' -v
