<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>HeatLoop — test nakładki</title><style>body{margin:0;background:#0d1726;color:#eaf2fa;font:15px system-ui}header,footer{padding:12px 16px}h2{margin:0 0 5px}small{color:#a8bfd1}canvas{display:block;width:100%;height: min(63vh,590px);background:#f6f8fa;touch-action:none}button{font:inherit;padding:12px;border:1px solid #58758c;border-radius:9px;background:#203b53;color:white}button:active{background:#337ea7}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px}#metrics{padding:0 14px 14px;line-height:1.6}.on{background:#137b82}input{width:100%}</style></head><body><header><h2>HeatLoop — nakładka ślimaka</h2><small>Prototyp geometryczny · nie do projektów wykonawczych</small></header><canvas id="view"></canvas><div class="buttons"><button id="move" class="on">Przesuń</button><button id="start">Początek</button><button id="left">↶ 15°</button><button id="right">↷ 15°</button><button id="mirror">Odbij</button><button id="reset">Reset</button></div><div id="metrics"></div><footer><small>Przeciągnij palcem, aby przesunąć wzór. W trybie „Początek” dotknij obszaru wokół pętli. Początek i koniec pozostają dwoma osobnymi końcówkami. Układ ma charakter demonstracyjny.</small></footer><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),metrics=document.querySelector('#metrics');let mode='move',angle=0,mirror=false,dx=0,dy=0,exitAngle=Math.PI,drag=null;
const W=6,H=4,turns=8;let pts=[];
function build(){pts=[];const gap=.23;let l=.2,r=W-.2,t=.2,b=H-.2;for(let i=0;i<turns;i++){if(r<=l||b<=t)break;pts.push([l,t],[r,t],[r,b],[l,b]);l+=gap;r-=gap;t+=gap;b-=gap}}
// Coordinates of prototype polyline; not yet a true return snail.
function transform(p){let x=p[0]-W/2,y=p[1]-H/2;if(mirror)x=-x;return [W/2+dx+x*Math.cos(angle)-y*Math.sin(angle),H/2+dy+x*Math.sin(angle)+y*Math.cos(angle)]}
let scale=1,ox=0,oy=0;
function screen(p){return [ox+p[0]*scale,oy+p[1]*scale]}
function world(x,y){return [(x-ox)/scale,(y-oy)/scale]}
function draw(){const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const width=rect.width,height=rect.height;ctx.clearRect(0,0,width,height);scale=Math.min((width-36)/W,(height-36)/H);ox=(width-W*scale)/2;oy=(height-H*scale)/2;
ctx.strokeStyle='#ccd7df';ctx.lineWidth=2;ctx.strokeRect(ox,oy,W*scale,H*scale);
const p=pts.map(transform).map(screen);ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#c74438';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
const center=transform([W/2,H/2]);const e=[center[0]+Math.cos(exitAngle)*2.65,center[1]+Math.sin(exitAngle)*1.65];const [ex,ey]=screen(e);ctx.fillStyle='#147e8c';ctx.beginPath();ctx.arc(ex,ey,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('P',ex,ey+4);
const length=pts.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);metrics.textContent='Obrót: '+Math.round(angle*180/Math.PI)+'° · Odbicie: '+(mirror?'tak':'nie')+' · Długość szkicu: '+length.toFixed(2)+' m · Punkt wyjścia: P (symboliczny).';}
function active(){document.querySelector('#move').classList.toggle('on',mode==='move');document.querySelector('#start').classList.toggle('on',mode==='start')}
document.querySelector('#move').onclick=()=>{mode='move';active()};document.querySelector('#start').onclick=()=>{mode='start';active()};document.querySelector('#left').onclick=()=>{angle-=Math.PI/12;draw()};document.querySelector('#right').onclick=()=>{angle+=Math.PI/12;draw()};document.querySelector('#mirror').onclick=()=>{mirror=!mirror;draw()};document.querySelector('#reset').onclick=()=>{angle=0;mirror=false;dx=dy=0;exitAngle=Math.PI;draw()};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();const p=world(e.clientX-r.left,e.clientY-r.top);if(mode==='start'){const c=transform([W/2,H/2]);exitAngle=Math.atan2((p[1]-c[1])/H,(p[0]-c[0])/W);draw()}else drag={id:e.pointerId,p}});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const r=canvas.getBoundingClientRect(),p=world(e.clientX-r.left,e.clientY-r.top);dx+=p[0]-drag.p[0];dy+=p[1]-drag.p[1];drag.p=p;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);addEventListener('resize',draw);build();draw();
</script></body></html>
