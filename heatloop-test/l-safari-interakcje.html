<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeatLoop L — test Safari</title><style>body{font:16px system-ui;margin:0;background:#f3f7fa;color:#183349}header{background:#163d58;color:white;padding:16px}main{padding:14px;max-width:800px;margin:auto}button,select{font:inherit;padding:12px;margin:4px;border-radius:9px;border:1px solid #9db1c0;background:white}button{background:#dceefb}svg{width:100%;background:white;border:1px solid #ccdce6;border-radius:12px;touch-action:manipulation}p{line-height:1.4}.small{font-size:13px;color:#526a78}</style><header><b>HeatLoop L — test Safari (prototyp interakcji)</b></header><main><label>Rozstaw: <select id="pitch"><option value="10">10 cm</option><option value="12">12 cm</option><option value="15" selected>15 cm</option><option value="20">20 cm</option></select></label><div><button id="turn">Obróć pętlę 180°</button><button id="mirror">Lewy / prawy ślimak</button><button id="start">Wyznacz początek</button></div><p id="status">Gotowe</p><svg id="plan" viewBox="0 0 500 430" aria-label="Rysunek pomieszczenia L i trasy testowej"><path d="M45 30H455V215H260V390H45Z" fill="#f1f8fc" stroke="#264c61" stroke-width="4"/><g id="route"></g></svg><p class="small">To nowy, uproszczony tester interakcji w Safari, nie pełny algorytm obliczeniowy zaakceptowanej pętli L. Nie służy do wyznaczania długości montażowej ani promieni gięcia.</p></main><script>
const $=x=>document.getElementById(x);let angle=0,mirror=false,swap=false,picking=false;
function draw(){let pitch=+$('pitch').value,step=pitch*1.18;let pts=[];let left=60,top=45,right=440,bottom=375,cornerX=245,cornerY=200;
for(let i=0;i<Math.floor(150/step);i++){let d=i*step;let a=left+d,b=top+d,c=right-d,e=bottom-d,k=cornerX-d,j=cornerY-d;if(a>=k-10||b>=j-10)break;pts.push([a,b],[c,b],[c,j],[k,j],[k,e],[a,e],[a,b+step*.48]);}
if(pts.length<2)return;
let q=pts.map(([x,y])=>{if(mirror)x=500-x;if(angle){x=500-x;y=430-y}return [x,y]});let first=swap?q[q.length-1]:q[0],last=swap?q[0]:q[q.length-1];let path=q.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');
$('route').innerHTML='<path d="'+path+'" stroke="#1483c6" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+first[0]+'" cy="'+first[1]+'" r="9" fill="#17a55a"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="9" fill="#df6c38"/>';
$('status').textContent='Rozstaw: '+pitch+' cm · '+(mirror?'układ lustrzany':'układ podstawowy')+' · zielony: początek · pomarańczowy: koniec'+(picking?' · dotknij zielonego lub pomarańczowego końca':'');
}
$('pitch').onchange=draw;$('turn').onclick=()=>{angle=angle?0:180;draw()};$('mirror').onclick=()=>{mirror=!mirror;draw()};$('start').onclick=()=>{picking=true;draw()};$('plan').onclick=e=>{if(!picking)return;swap=!swap;picking=false;draw()};draw();
</script></html>
