<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeatLoop L — zagęszczanie zwojów</title><style>body{margin:0;background:#edf4f8;font:16px system-ui;color:#193b51}header{background:#21445c;color:#fff;padding:16px}main{max-width:760px;margin:auto;padding:14px}select{font:inherit;padding:12px;border-radius:8px}svg{width:100%;background:#fff;border:1px solid #cbdce5;border-radius:12px}#info{padding:12px;background:#fff;border-left:5px solid #d69a26;white-space:pre-line}small{color:#526d7d}</style><header><b>HeatLoop L — test zagęszczania zwojów</b></header><main><p>Rozstaw: <select id="pitch"><option value="10">10 cm</option><option value="12">12 cm</option><option value="15" selected>15 cm</option><option value="20">20 cm</option></select></p><p id="info"></p><svg viewBox="280 155 340 340"><path d="M300 175H600V325H450V475H300Z" fill="#f7fbfe" stroke="#415e70" stroke-width="2"/><g id="paths" fill="none" stroke="#147eb9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></g></svg><p><small>Test liczby zwojów i pokrycia powierzchni. Widoczne są dwa niezależne szkice ślimaków. Łącznik i pełna ciągłość hydrauliczna nie są jeszcze rozwiązane, dlatego układ nie jest projektem wykonawczym. Nie używać do montażu.</small></p></main><script>
const el=id=>document.getElementById(id);
function spiral(x0,y0,x1,y1,step){let x=x0+12,y=y0+12,r=x1-12,b=y1-12;let pts=[],n=0;while(r-x>step*1.4&&b-y>step*1.4&&n<40){pts.push([x,y],[r,y],[r,b],[x,b]);x+=step;y+=step;r-=step;b-=step;n++}if(n){pts.push([x,y])}return {d:pts.map((q,i)=>(i?'L':'M')+q.join(' ')).join(' '),n}}
function update(){let p=+el('pitch').value,step=p,one=spiral(300,175,450,475,step),two=spiral(450,175,600,325,step);el('paths').innerHTML='<path d="'+one.d+'"/><path d="'+two.d+'"/>';el('info').textContent='Wybrano '+p+' cm. Lewa część: '+one.n+' zwojów; prawa część: '+two.n+' zwojów.\nWraz ze zmniejszeniem rozstawu rośnie liczba zwojów. Status: TEST POKRYCIA — połączenie ślimaków i geometria gięć niezweryfikowane.'}
el('pitch').addEventListener('change',update);update();
</script></html>
